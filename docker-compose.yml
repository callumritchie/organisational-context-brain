services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg18
    environment:
      POSTGRES_DB: org_brain
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d org_brain']
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - org_brain_postgres:/var/lib/postgresql/data

volumes:
  org_brain_postgres:
