name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_DB: org_brain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d org_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_OWNER: postgresql://postgres:postgres@127.0.0.1:5432/org_brain
      DATABASE_URL_INGEST: postgresql://org_brain_ingest:org_brain_ingest@127.0.0.1:5432/org_brain
      DATABASE_PASSWORD_INGEST: org_brain_ingest
      DATABASE_URL_APP: postgresql://org_brain_app:org_brain_app@127.0.0.1:5432/org_brain
      DATABASE_PASSWORD_APP: org_brain_app
      AI_MODE: offline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run demo:setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
