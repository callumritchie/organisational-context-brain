name: CI

permissions:
  contents: read

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg18
        env:
          POSTGRES_DB: org_brain
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d org_brain"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_OWNER: postgresql://postgres:postgres@127.0.0.1:5432/org_brain
      DATABASE_URL_INGEST: postgresql://org_brain_ingest:org_brain_ingest@127.0.0.1:5432/org_brain
      DATABASE_PASSWORD_INGEST: org_brain_ingest
      DATABASE_URL_APP: postgresql://org_brain_app:org_brain_app@127.0.0.1:5432/org_brain
      DATABASE_PASSWORD_APP: org_brain_app
      AI_MODE: offline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run demo:setup
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - name: Validate production topology
        env:
          APP_COMMIT_SHA: '0000000000000000000000000000000000000000'
          DATABASE_URL_APP: postgresql://app:test@db.example/org?sslmode=require
          DATABASE_URL_INGEST: postgresql://ingest:test@db.example/org?sslmode=require
          DATABASE_URL_OWNER: postgresql://owner:test@db.example/org?sslmode=require
          DATABASE_PASSWORD_APP: ci-application-password
          DATABASE_PASSWORD_INGEST: ci-ingestion-password
          AUTH_OIDC_ISSUER: https://identity.example/
          AUTH_OIDC_AUDIENCE: org-brain-api
          AUTH_OIDC_JWKS_URL: https://identity.example/jwks
          AUTH_OIDC_AUTHORIZATION_URL: https://identity.example/authorize
          AUTH_OIDC_TOKEN_URL: https://identity.example/token
          AUTH_OIDC_CLIENT_ID: org-brain-web
          AUTH_OIDC_REDIRECT_URI: https://brain.example/api/v1/auth/callback
          AUTH_PUBLIC_ORIGIN: https://brain.example
        run: docker compose -f docker-compose.production.yml config --quiet
      - run: docker build --target web -t org-brain-web:ci .
      - run: docker build --target operations -t org-brain-operations:ci .
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
